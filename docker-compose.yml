services:
  web:
    build: .
    container_name: helpdesk-web
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-helpdesk}
      DB_USER: ${DB_USER:-helpdesk}
      DB_PASS: ${DB_PASS:?Isi DB_PASS di file .env}
    volumes:
      # Mount source code supaya perubahan langsung terlihat tanpa rebuild
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: helpdesk-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Isi DB_ROOT_PASS di file .env}
      MARIADB_DATABASE: ${DB_NAME:-helpdesk}
      MARIADB_USER: ${DB_USER:-helpdesk}
      MARIADB_PASSWORD: ${DB_PASS:?Isi DB_PASS di file .env}
    volumes:
      - db_data:/var/lib/mysql
      # Dijalankan otomatis HANYA saat volume database masih kosong
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: helpdesk-pma
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
