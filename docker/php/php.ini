; IT Helpdesk - konfigurasi PHP

; Jangan bocorkan versi PHP
expose_php = Off

; Error tidak ditampilkan ke user, dicatat ke log container (docker compose logs web)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Upload file (foto profil)
file_uploads = On
upload_max_filesize = 2M
post_max_size = 8M
max_file_uploads = 5

; Session aman
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
; Ubah ke 1 jika aplikasi dijalankan lewat HTTPS
session.cookie_secure = 0

; Nonaktifkan include/fopen dari URL remote
allow_url_fopen = Off
allow_url_include = Off

date.timezone = Asia/Jakarta
