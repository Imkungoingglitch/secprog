# IT Helpdesk - hardening Apache
# Nama diawali "zz-" supaya dimuat setelah security.conf bawaan Debian.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
</Directory>

# Folder yang hanya di-include oleh PHP, tidak boleh diakses langsung dari browser
<DirectoryMatch "^/var/www/html/(config|includes|database|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Folder upload: matikan eksekusi PHP (cegah upload web shell)
<Directory /var/www/html/uploads>
    php_admin_flag engine off
    <FilesMatch "(?i)\.(php\d?|phtml|phar|phps)$">
        Require all denied
    </FilesMatch>
</Directory>

# Blokir dotfile (.env, .git, .htaccess, dll) dan file non-aplikasi
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "(?i)^(Dockerfile|docker-compose\.ya?ml)$|\.(md|sql|ini|log|conf)$">
    Require all denied
</FilesMatch>

# Security headers
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
